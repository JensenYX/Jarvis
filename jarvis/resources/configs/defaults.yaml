  asr: ws://127.0.0.1:8767/ws
server:
  host: 127.0.0.1
  port: 8765
native_routing:
  enabled: true
  asr_observer: true
  binding_timeout_s: 20
  independent_memory: true
  resolve_delegated_fast: true
  delegated_continuity: true
  pending_context: true
  conversation_history_turns: 32
  generation_options:
    allow_native_interrupt: true
    protocol_grammar: true
    marker_only: true
    clean_speech: true
    verify_speech: false
    max_new_tokens: 96
screen:
  enabled: false
game_expansion:
  enabled: false
voxel:
  enabled: false
