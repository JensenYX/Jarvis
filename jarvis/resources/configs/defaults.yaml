  documents: null
  web_search_provider: bing_rss
  task_artifacts: true
  news_provider: google_news_rss
  weather_provider: open_meteo
  artifacts_enabled: true
  artifact_directory: artifacts
memory:
  enabled: true
  candidate_k: 12
  selected_k: 3
  max_expansions: 1
  task_journal: true
  profile_context: true
