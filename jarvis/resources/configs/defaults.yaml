runtime:
  max_active_workers: 3
  max_queued_tasks: 6
  hold_deadline_ms: 11000
  pending_audio_budget_ms: 3500
  response_timeout_s: 45
  delivery_max_attempts: 2
  delivery_retry_s: 1
  result_ready_hint_s: 12
  database: memory.sqlite3
  playback_control_v2: true
  playback_control_v3: true
  no_audible_result_retry: true
  singular_result_recall: true
  task_dialogue: true
  task_interaction_v2: true
  conversation_v3: true
  intentional_delivery_interruptions: true
  targeted_task_recall: true
  task_orchestration: true
  reversible_interruptions: true
  batch_requests: true
  max_context_tasks: 12
  conversational_delivery: true
  result_pause_ms: 350
  result_chain_pause_ms: 180
jev:
  keepalive_s: 60
  prewarm_connection: true
  total_deadline_ms: 2500
  fallback_deadline_ms: 8000
  max_retries: 0
