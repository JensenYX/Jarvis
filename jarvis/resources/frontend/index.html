<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jarvis · Audio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #142e36;
        background: #f4f4ef;
      }
      body {
        max-width: 780px;
        margin: 8vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 36px;
        font-weight: 600;
      }
      p {
        line-height: 1.7;
        color: #455d64;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 13px 20px;
        font: inherit;
        cursor: pointer;
        background: #155e61;
        color: white;
        margin-right: 10px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #stop {
        background: #85472e;
      }
      #status {
        display: inline-block;
        padding: 8px 12px;
        background: #e0eae5;
        border-radius: 20px;
      }
      #transcript {
        min-height: 150px;
        padding: 24px;
        background: white;
        border-radius: 16px;
        margin: 26px 0;
        font-size: 21px;
        line-height: 1.7;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 80px;
        border: 1px solid #c7d1cb;
        border-radius: 10px;
        padding: 12px;
        font: inherit;
      }
      summary {
        cursor: pointer;
        margin: 24px 0 12px;
      }
      pre {
        background: #e8ede8;
        padding: 12px;
        max-height: 260px;
        overflow: auto;
        font-size: 12px;
        white-space: pre-wrap;
      }
      small {
        display: block;
        margin-top: 12px;
        color: #54676b;
      }
    </style>
  </head>
  <body>
    <span id="status">尚未连接</span>
    <h1>Jarvis</h1>
    <p>可以继续提问、修改要求，或随时让我停下来。</p>
    <button id="connect">开始对话</button
    ><button id="stop" disabled>停止说话</button
    ><button id="disconnect" disabled>结束对话</button>
    <label for="language">语言 / Language</label>
    <select id="language">
      <option value="auto">自动 / Auto</option>
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <div id="transcript" aria-live="polite">连接后，请直接说话。</div>
    <section id="results" aria-live="polite"></section>
    <details>
      <summary>反馈这次对话</summary>
      <textarea
        id="feedback"
        placeholder="哪里不符合你的预期？你希望怎样回答？"
      ></textarea
      ><button id="sendFeedback">保存反馈</button
      ><small id="feedbackStatus">反馈保存在当前会话中。</small>
    </details>
    <details>
      <summary>连接信息</summary>
      <pre id="debug"></pre>
    </details>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
