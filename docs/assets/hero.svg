<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis</title>
  <desc id="desc">A harness for full-duplex Audio and Omni agents. A voice signal stays connected to background tasks while conversation continues.</desc>
