<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis architecture</title>
  <desc id="desc">The fast brain keeps listening and speaking. Its native gate delegates turns through ASR binding to JEV. JEV chooses typed operations on the task ledger, which runs workers and tools. Memory serves JEV and the ledger. Valid results return through the speech model; playback receipts confirm delivery. Jarvis-Omni adds an evidence timeline and belief state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#77859a"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#b94743"/></marker>
    <linearGradient id="decision"><stop stop-color="#2464c7"/><stop offset="1" stop-color="#7251b8"/></linearGradient>
  </defs>
