<svg xmlns="http://www.w3.org/2000/svg" class="arch__svg" viewBox="0 0 1236 400" role="img" aria-labelledby="arch-title arch-desc">
                <title id="arch-title">Overview of the Jarvis harness</title>
                <desc id="arch-desc">
                  Audio from the user reaches the Native Gate of the fast brain, which either lets the frozen speech
                  model answer directly or delegates the turn. A delegated turn is bound to its transcript, JEV turns it
                  into typed operations, the Task Ledger runs them on workers and tools, and Delivery sends live results
                  back to the speech model, which reports playback receipts. Memory serves JEV and the ledger; Jarvis-Omni
                  adds an Evidence Timeline and Belief State.
                </desc>
                <style>.arch__svg {
  width: 100%;
  min-width: 880px;
  height: auto;
  font-family: Arial, sans-serif;
}
.arch-group {
