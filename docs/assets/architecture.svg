}
.arch-box rect {
  stroke-width: 1.3;
}
.arch-box--user rect {
  fill: #f1f4f9;
  stroke: #9aa5b4;
}
.arch-box--amber rect {
  fill: #fdf3e2;
  stroke: #e39b2d;
}
.arch-box--slate rect {
  fill: #f3f6fa;
  stroke: #a0aec0;
}
.arch-box--dashed rect {
  fill: #f8fafc;
  stroke: #94a3b8;
  stroke-dasharray: 5 4;
}
.arch-box--plum rect {
  fill: #f1ecfa;
  stroke: #7c5cbf;
}
.arch-box--teal rect {
  fill: #e5f5f2;
  stroke: #14998a;
}
.arch-box--coral rect {
  fill: #fbe9e8;
  stroke: #d9534f;
}
.arch-box--jev rect {
  fill: url(#jev-fill);
  stroke: none;
  filter: drop-shadow(0 8px 14px rgba(31, 95, 209, 0.35));
}
.arch-title {
  font-size: 16px;
  font-weight: 700;
  fill: #16233d;
}
.arch-title--sm {
  font-size: 14.5px;
}
.arch-sub {
  font-family: monospace;
  font-size: 10.5px;
  fill: #5b6478;
}
.arch-box--jev .arch-title,
.arch-box--jev .arch-sub {
  fill: #fff;
}
.arch-arrows path {
  stroke: #5b6478;
  stroke-width: 1.5;
}
.arch-arrows .arch-arrow--dashed {
  stroke-dasharray: 5 4;
}
.arch-arrows .arch-arrow--coral {
  stroke: #c2413c;
}
.arch-labels text {
  font-size: 11px;
  fill: #5b6478;
}
.arch-labels .arch-label--strong {
  font-size: 10.5px;
  font-weight: 700;
  fill: #174ea6;
}
.arch-labels .arch-label--coral {
  fill: #b23a35;
}
.arch-pulses {
  opacity: 0;
  transition: opacity 600ms ease;
}
.arch.is-live .arch-pulses {
  opacity: 1;
}

</style><rect width="1236" height="400" fill="white"/><defs>
