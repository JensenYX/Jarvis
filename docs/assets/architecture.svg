  stroke-dasharray: 6 5;
}
.arch-group--fast {
  fill: rgba(227, 155, 45, 0.05);
  stroke: rgba(227, 155, 45, 0.75);
}
.arch-group--slow {
  fill: rgba(59, 125, 221, 0.04);
  stroke: rgba(59, 125, 221, 0.55);
}
.arch-tab text {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-anchor: middle;
}
.arch-tab--fast rect {
  fill: #fbebd2;
}
.arch-tab--fast text {
  fill: #a86a12;
}
.arch-tab--slow rect {
  fill: #d6e4fa;
}
.arch-tab--slow text {
